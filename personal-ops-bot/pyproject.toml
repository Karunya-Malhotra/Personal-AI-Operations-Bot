[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "personal-ops-bot"
version = "0.1.0"
description = "Personal AI operations bot - conversational interface over structured personal services"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "structlog>=24.4",
    "typer>=0.15",
    # LLM provider SDKs. Confined to app/providers/llm/ by an import contract --
    # nothing above that boundary may import either one.
    "anthropic>=0.40",
    "google-genai>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.13",
    "import-linter>=2.1",
    "testcontainers[postgres]>=4.8",
]

[project.scripts]
aiops = "app.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ---------------------------------------------------------------------------
# Lint
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "B",         # bugbear
    "UP",        # pyupgrade
    "ASYNC",     # async correctness
    "DTZ",       # naive datetimes are a bug (see app/core/clock.py)
    "S",         # bandit (security)
    "T20",       # no print() outside the CLI
    "RUF",
]
ignore = [
    "S101",  # assert is fine in tests and in boot assertions
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "T20"]
"app/cli.py" = ["T20"]          # the CLI is the one place stdout IS the interface
# Autogenerated migrations: alembic emits one long line per column and we do
# not reformat them, because a hand-edited migration is harder to diff against
# a regenerated one. I001 for the same reason (import order is alembic's).
"alembic/versions/*" = ["I001", "E501"]
"alembic/*" = ["I001"]
"app/core/clock.py" = ["DTZ"]   # the one module allowed to read the wall clock

# ---------------------------------------------------------------------------
# Types
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]

# app.core is the pure domain kernel: strictest setting in the repo.
[[tool.mypy.overrides]]
module = "app.core.*"
strict = true

[[tool.mypy.overrides]]
module = ["testcontainers.*", "alembic.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Tests
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: requires a real PostgreSQL (testcontainers)",
    "architecture: enforces structural rules, not behaviour",
]
filterwarnings = ["error::DeprecationWarning"]

# ---------------------------------------------------------------------------
# Architecture enforcement
#
# These contracts are the mechanical version of the dependency rules in
# docs/ARCHITECTURE.md. They grow as packages arrive; every layer listed here
# must actually exist, so we only declare what M1A ships.
# ---------------------------------------------------------------------------
[tool.importlinter]
root_package = "app"
# Required so the "core is pure" contract can name third-party packages.
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers point inward only"
type = "layers"
layers = [
    "app.main : app.cli : app.bootstrap",
    "app.api",
    # The Agent Runtime orchestrates a turn, so it sits above both the domain
    # it reads (conversations) and the adapter it calls (providers). Nothing
    # below it may reach back up -- a domain service that could start a run
    # would mean turns were being orchestrated in two places.
    "app.agent",
    "app.domains : app.providers",
    "app.db",
    "app.config : app.observability",
    "app.core",
]

[[tool.importlinter.contracts]]
name = "db never reads settings; it is handed what it needs"
type = "forbidden"
source_modules = ["app.db"]
forbidden_modules = ["app.config"]

# The layers contract above puts config and observability in the same layer,
# which says they are siblings but does not state the direction that matters.
# `configure_logging(level=..., json_output=...)` takes primitives on purpose,
# so that a worker, a migration or a one-off script can set up logging without
# constructing Settings. The moment observability imports config that property
# is gone, and it would go quietly -- nothing would fail, the coupling would
# just exist. This states the rule the module was written to satisfy.
[[tool.importlinter.contracts]]
name = "observability never reads settings; it takes primitives"
type = "forbidden"
source_modules = ["app.observability"]
forbidden_modules = ["app.config"]

# Listing domains and providers as siblings in the layers contract above does
# NOT make them independent -- verified by injection: `domains -> providers`
# left every contract KEPT. This states the rule explicitly, in both directions
# at once, which is what "independence" means and what the layers line only
# looked like it said.
#
# The rule itself: ARCHITECTURE describes domains/ as "BUSINESS LOGIC, no LLM,
# no prompts". A conversation service that could call a model would start
# making model calls, and the Agent Runtime would stop being the only place a
# turn is orchestrated. In the other direction, a provider that knew what a
# conversation was would stop being substitutable.
[[tool.importlinter.contracts]]
name = "domains and providers are independent"
type = "independence"
modules = ["app.domains", "app.providers"]

# Providers are outward adapters. They translate between this application's
# vocabulary and someone else's API, and that is all. One reaching into app.db
# would mean a provider had started keeping its own state in our storage, which
# is how an adapter quietly turns into a second, undocumented domain layer.
[[tool.importlinter.contracts]]
name = "providers are adapters: they never touch our storage"
type = "forbidden"
source_modules = ["app.providers"]
forbidden_modules = ["app.db", "app.config"]

# The substitution promise in app/core/llm.py, made checkable. Every layer that
# is not the provider package is forbidden from importing a vendor SDK, so
# "nothing above this line ever saw an Anthropic type" is enforced rather than
# merely intended -- which is what makes swapping or adding a provider a new
# file plus a config value.
#
# `allow_indirect_imports` is deliberate: bootstrap imports the factory, and the
# factory imports an adapter, which imports its SDK. That chain is the boundary
# working correctly. What must never happen is a *direct* import outside the
# provider package, which is exactly what this catches.
[[tool.importlinter.contracts]]
name = "vendor SDKs stay behind the provider boundary"
type = "forbidden"
source_modules = [
    "app.core",
    "app.config",
    "app.observability",
    "app.db",
    "app.domains",
    "app.agent",
    "app.api",
    "app.bootstrap",
    "app.cli",
    "app.main",
]
forbidden_modules = ["anthropic", "google"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "core is pure: no frameworks, no drivers, no I/O libraries"
type = "forbidden"
source_modules = ["app.core"]
forbidden_modules = [
    "sqlalchemy",
    "asyncpg",
    "fastapi",
    "starlette",
    "structlog",
    "typer",
    "pydantic_settings",
    "anthropic",
    "google",
]
