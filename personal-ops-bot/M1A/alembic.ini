[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
# Numbered, sortable revision filenames. Alembic's default random hex is
# unreadable in a directory listing; migration order is something you read.
file_template = %%(rev)s_%%(slug)s
# The DSN is deliberately absent: env.py reads it from Settings so there is
# exactly one source of truth for the connection string.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
